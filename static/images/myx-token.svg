<!-- /static/images/myx-token.svg  |  License: CC0 (public domain) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">MYX token (neutral badge)</title>
  <desc id="desc">Generic circular coin with the letters MYX, no official branding.</desc>

  <defs>
    <radialGradient id="g" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#58C4F6"/>
      <stop offset="55%" stop-color="#4F7CF6"/>
      <stop offset="100%" stop-color="#6B4FF6"/>
    </radialGradient>

    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.65"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.25"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- shadow -->
  <g filter="url(#shadow)">
    <!-- coin base -->
    <circle cx="256" cy="256" r="208" fill="url(#g)"/>
    <!-- outer rim shine -->
    <circle cx="256" cy="256" r="208" fill="none" stroke="url(#rim)" stroke-width="16"/>
    <!-- inner ring -->
    <circle cx="256" cy="256" r="170" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="8"/>
  </g>

  <!-- MYX text -->
  <g fill="#FFFFFF">
    <text x="50%" y="54%" text-anchor="middle" font-size="148" font-weight="700" font-family="Inter,system-ui,Segoe UI,Arial,sans-serif" letter-spacing="6">MYX</text>
    <!-- subtle gloss -->
    <ellipse cx="256" cy="210" rx="150" ry="40" fill="#FFFFFF" opacity="0.10"/>
  </g>

  <!-- subtle grain -->
  <g opacity="0.05">
    <circle cx="180" cy="160" r="2" fill="#fff"/>
    <circle cx="340" cy="180" r="2" fill="#fff"/>
    <circle cx="220" cy="320" r="2" fill="#fff"/>
    <circle cx="300" cy="280" r="2" fill="#fff"/>
  </g>
</svg>
