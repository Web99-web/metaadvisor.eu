name: Publish from Inbox (manual)

on:
  workflow_dispatch: {}   # pokrećeš ručno iz Actions

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-frontmatter pyyaml googletrans==4.0.0-rc1

      - name: Publish selected from inbox
        run: |
          python publish_from_inbox.py --limit 10

      # 🔎 DEBUG — pokaži što je skripta napravila
      - name: Show generated folders/files
        run: |
          echo "---- EN (content/news) ----"
          ls -R content/news || true
          echo "---- HR (content/hr/news) ----"
          ls -R content/hr/news || true
          echo "---- DE (content/de/news) ----"
          ls -R content/de/news || true
          echo "---- GIT STATUS ----"
          git status --porcelain

      # ✅ Forsirani commit svega što se promijenilo/dodalo
      - name: Commit & push all changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: publish from inbox → EN/HR/DE bundles" || echo "No changes"
          git push
