name: Build & Deploy (Hugo → Netlify)

on:
  push:
    branches: [ main ]        # automatski na svaki push u main
  workflow_dispatch: {}       # i ručno pokretanje

permissions:
  contents: read

concurrency:
  group: "deploy"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.128.0'
          extended: true

      - name: Build site
        run: hugo --minify


      - name: Deploy to Netlify (no Netlify build minutes)
        uses: netlify/actions/cli@v4
        with:
          args: deploy --dir=public --prod --message "GitHub Actions ${{ github.sha }}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID:    ${{ secrets.NETLIFY_SITE_ID }}

