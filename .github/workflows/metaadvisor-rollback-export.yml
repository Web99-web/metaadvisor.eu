name: Export verified rollback chunks (NO DEPLOY)
"on":
  push:
    branches: ["qa/metaadvisor-linux-2026-10-30"]
    paths: [".github/workflows/metaadvisor-rollback-export.yml"]
permissions:
  contents: read
  actions: read
jobs:
  export:
    if: github.ref == 'refs/heads/qa/metaadvisor-linux-2026-10-30'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: metaadvisor-rollback-package-923fedc485eebe80befb9adf9c344668a8175539
          run-id: 41146004737
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: rollback
      - name: Validate immutable archive and split for local backup
        shell: python
        run: |
          from pathlib import Path
          import hashlib,json
          p=Path('rollback/rollback-site.tar.gz')
          with p.open('rb') as f: assert hashlib.file_digest(f,'sha256').hexdigest()=='865e392ab1161e42df0a25fc8b722d5fb8a87cf4e3020b3aabb91d19c958e0e2'
          rows=[]
          with p.open('rb') as f:
            for n in range(1,4):
              data=f.read(200*1024*1024); assert data
              q=Path('rollback')/f'rollback.part{n}';q.write_bytes(data);rows.append({'file':q.name,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()})
            assert not f.read(1)
          Path('rollback/CHUNKS.json').write_text(json.dumps(rows,indent=2))
      - uses: actions/upload-artifact@v4
        with:
          name: rollback-part1
          retention-days: 14
          path: rollback/rollback.part1
      - uses: actions/upload-artifact@v4
        with:
          name: rollback-part2
          retention-days: 14
          path: rollback/rollback.part2
      - uses: actions/upload-artifact@v4
        with:
          name: rollback-part3
          retention-days: 14
          path: rollback/rollback.part3
      - uses: actions/upload-artifact@v4
        with:
          name: rollback-chunk-manifest
          retention-days: 14
          path: rollback/CHUNKS.json
