name: Deploy Hugo site to Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [AUTO, FULL]
        default: FULL
permissions:
  contents: read
  actions: read
concurrency:
  group: ${{ github.event_name == 'schedule' && 'editorial-full-audit' || 'pages' }}
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_MODE: ${{ inputs.mode || 'AUTO' }}
        run: python3 -B tools/editorial/workflow_driver.py plan --base "$BASE_SHA" --event "$EVENT_NAME" --requested "$REQUESTED_MODE" --context "$RUNNER_TEMP/context.json"
      - uses: actions/upload-artifact@v4
        with:
          name: editorial-plan-${{ github.sha }}
          path: ${{ runner.temp }}/context.json
          retention-days: 3
  verify:
    name: ${{ needs.plan.outputs.mode }} verification
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      GIT_OPTIONAL_LOCKS: '0'
      GOMAXPROCS: '2'
    outputs:
      receipt_sha256: ${{ steps.verify.outputs.receipt_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/editorial/requirements.txt
      - run: python3 -m pip install -r tools/editorial/requirements.txt
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/editorial-cache
          key: editorial-${{ runner.os }}-hugo-0.128.0-${{ hashFiles('config.toml','tools/editorial/**','data/**','migration/**') }}
      - name: Install pinned Hugo extended
        run: |
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/hugo.deb" https://github.com/gohugoio/hugo/releases/download/v0.128.0/hugo_extended_0.128.0_linux-amd64.deb
          dpkg-deb -x "$RUNNER_TEMP/hugo.deb" "$RUNNER_TEMP/hugo-tool"
          dirname "$(find "$RUNNER_TEMP/hugo-tool" -type f -name hugo)" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        with:
          name: editorial-plan-${{ github.sha }}
          path: ${{ runner.temp }}/plan
      - id: verify
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/editorial-cache
        run: python3 -B tools/editorial/workflow_driver.py build --context "$RUNNER_TEMP/plan/context.json" --source "$RUNNER_TEMP/editorial-source" --output "$RUNNER_TEMP/editorial-build"
      - uses: actions/upload-artifact@v4
        with:
          name: editorial-verified-${{ github.sha }}
          path: |
            ${{ runner.temp }}/editorial-build/qa-site.tar.gz
            ${{ runner.temp }}/editorial-build/release-receipt.json
            ${{ runner.temp }}/editorial-build/verified-file-manifest.json
          retention-days: 3
      - if: needs.plan.outputs.mode == 'FULL'
        uses: actions/upload-artifact@v4
        with:
          name: editorial-full-proof-${{ github.sha }}
          path: ${{ runner.temp }}/editorial-build/full-proof.json
          retention-days: 90
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editorial-reports-${{ github.sha }}
          path: |
            ${{ runner.temp }}/editorial-build/*.json
            ${{ runner.temp }}/editorial-build/*.log
          retention-days: 3
  deploy:
    if: needs.plan.outputs.publish == 'true'
    needs: [plan, verify]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: editorial-plan-${{ github.sha }}
          path: ${{ runner.temp }}/plan
      - uses: actions/download-artifact@v4
        with:
          name: editorial-verified-${{ github.sha }}
          path: ${{ runner.temp }}/verified
      - name: Verify exact artifact and current main before upload
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RECEIPT_HASH: ${{ needs.verify.outputs.receipt_sha256 }}
        run: python3 -B tools/editorial/workflow_driver.py verify-bundle --context "$RUNNER_TEMP/plan/context.json" --bundle "$RUNNER_TEMP/verified" --receipt-hash "$RECEIPT_HASH"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/verified/public
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Notify IndexNow of changed article URLs after successful deployment
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -B tools/editorial/indexnow.py --public "$RUNNER_TEMP/verified/public" --report "$RUNNER_TEMP/indexnow-report.json" --send
      - name: Preserve IndexNow result without another workflow
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editorial-indexnow-${{ github.sha }}
          path: ${{ runner.temp }}/indexnow-report.json
          retention-days: 90
