name: MetaAdvisor isolated Linux QA (NO DEPLOY)
"on":
  push:
    branches: ["qa/metaadvisor-linux-2026-10-30"]
permissions:
  contents: read
concurrency:
  group: metaadvisor-isolated-linux-qa
  cancel-in-progress: false
jobs:
  qa:
    if: github.event_name == 'push' && github.ref == 'refs/heads/qa/metaadvisor-linux-2026-10-30'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      GIT_OPTIONAL_LOCKS: "0"
      GOMAXPROCS: "2"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare dependencies only on disposable Ubuntu runner
        shell: bash
        run: |
          set -euo pipefail
          echo "MA_QA_OUTPUT=$RUNNER_TEMP/metaadvisor-linux-qa" >> "$GITHUB_ENV"
          python3 -m pip install lxml==6.1.1 Pillow==12.3.0
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/hugo.deb" https://github.com/gohugoio/hugo/releases/download/v0.128.0/hugo_extended_0.128.0_linux-amd64.deb
          dpkg-deb -x "$RUNNER_TEMP/hugo.deb" "$RUNNER_TEMP/hugo-tool"
          mapfile -t hugo_bins < <(find "$RUNNER_TEMP/hugo-tool" -type f -name hugo)
          test "${#hugo_bins[@]}" -eq 1
          dirname "${hugo_bins[0]}" >> "$GITHUB_PATH"
          node --version
      - name: Verify latest snapshot, build and test (no release approvals changed)
        run: python3 -u -B .qa-linux/run_qa.py
      - name: Save QA reports even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metaadvisor-linux-qa-reports-${{ github.sha }}
          retention-days: 3
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/metaadvisor-linux-qa/*.json
            ${{ runner.temp }}/metaadvisor-linux-qa/*.csv
            ${{ runner.temp }}/metaadvisor-linux-qa/*.log
      - name: Save successful build as ordinary QA artifact, never Pages
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: metaadvisor-linux-QA-build-NOT-DEPLOYED-${{ github.sha }}
          retention-days: 3
          if-no-files-found: error
          path: ${{ runner.temp }}/metaadvisor-linux-qa/qa-site.tar.gz

  rollback:
    if: github.event_name == 'push' && github.ref == 'refs/heads/qa/metaadvisor-linux-2026-10-30'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      GOMAXPROCS: "2"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ec5206ea964d5ecad2e626465abe9dd8a9f80966
          path: rollback-source
          persist-credentials: false
      - name: Prepare official Hugo only on disposable runner
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/hugo.deb" https://github.com/gohugoio/hugo/releases/download/v0.128.0/hugo_extended_0.128.0_linux-amd64.deb
          dpkg-deb -x "$RUNNER_TEMP/hugo.deb" "$RUNNER_TEMP/hugo-tool"
          dirname "$(find "$RUNNER_TEMP/hugo-tool" -type f -name hugo)" >> "$GITHUB_PATH"
      - name: Rebuild and verify previous production without deployment
        run: python3 -u -B .qa-linux/build_rollback.py
      - name: Save rollback evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metaadvisor-rollback-reports-${{ github.sha }}
          retention-days: 14
          path: |
            ${{ runner.temp }}/verified-rollback/*.json
            ${{ runner.temp }}/verified-rollback/*.log
      - name: Save verified rollback package without deployment
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: metaadvisor-rollback-package-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: ${{ runner.temp }}/verified-rollback/rollback-site.tar.gz
