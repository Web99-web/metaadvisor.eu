name: Scrape & Commit (daily 06:00 UTC, EN→DE/HR via Google Translate)

on:
  schedule:
    - cron: "0 6 * * *"     # jednom dnevno u 06:00 UTC
  workflow_dispatch:         # ručno pokretanje iz Actions taba

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 python-frontmatter feedparser Pillow googletrans==4.0.0-rc1

      - name: Run scraper
        run: |
          python scraper.py

      - name: Commit scraped content
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: daily scrape & update content (EN/DE/HR)"
          file_pattern: |
            content/**
            static/news/**
            .scrape_seen.json
