name: Translate Existing News
permissions:
  contents: write

on:
  workflow_dispatch:

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install python-frontmatter googletrans==4.0.0-rc1

      - name: Run translation script
        run: |
          python translate_existing.py

      - name: Show translated folders (debug)
        run: |
          echo "--- content/de ---"; ls -R content/de || true
          echo "--- content/hr ---"; ls -R content/hr || true

      - name: Force add & push (no filters)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "== BEFORE ADD =="
          git status --porcelain
          git add -A
          echo "== AFTER ADD =="
          git status --porcelain
          git commit -m "Add DE/HR translations (forced)" || echo "No changes"
          git push
