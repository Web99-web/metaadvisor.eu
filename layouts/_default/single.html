{{ define "main" }}
  <article>
    <h1>{{ .Title }}</h1>

    <div class="article-meta">
      {{ .Date.Format "2006-01-02" }}
      {{ with .Params.category }} · <span class="badge {{ . | urlize }}">{{ . }}</span>{{ end }}
    </div>

    {{ with .Params.image }}
      <div class="hero"><img src="{{ . | relURL }}" alt=""></div>
    {{ end }}

    {{ partial "ad.html" . }}

    <div class="article-content">
      {{ .Content }}
    </div>

    {{ partial "ad.html" . }}
  </article>
{{ end }}
