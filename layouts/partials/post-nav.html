{{- $prev := .PrevInSection -}}
{{- $next := .NextInSection -}}
{{- if or $prev $next -}}
<hr style="margin:28px 0;border:none;border-top:1px solid #e5e7eb">
<div style="display:flex;gap:14px;flex-wrap:wrap">
  {{ with $prev }}
    <a href="{{ .RelPermalink }}" style="flex:1 1 320px;border:1px solid #e5e7eb;border-radius:12px;padding:12px;text-decoration:none;color:inherit;background:#fff">
      <div style="font-size:12px;color:#64748b">← {{ i18n "previous" | default "Previous" }}</div>
      <strong style="display:block;margin-top:4px">{{ .Title }}</strong>
    </a>
  {{ end }}
  {{ with $next }}
    <a href="{{ .RelPermalink }}" style="flex:1 1 320px;border:1px solid #e5e7eb;border-radius:12px;padding:12px;text-decoration:none;color:inherit;background:#fff">
      <div style="font-size:12px;color:#64748b">{{ i18n "next" | default "Next" }} →</div>
      <strong style="display:block;margin-top:4px">{{ .Title }}</strong>
    </a>
  {{ end }}
</div>
{{- end -}}
