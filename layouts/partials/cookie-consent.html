<div id="ma-consent" style="
  position: fixed;
  left: 0;
  right: 0;
  bottom: 56px;
  background: #0f172a;
  color: #fff;
  padding: 16px;
  z-index: 2147483648;
  display: none;
  font-size: 14px;
  box-sizing: border-box;
">
  <div style="
    max-width: 1100px;
    margin: auto;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
  ">
    <span>
      MetaAdvisor uses analytics cookies to measure readership.
    </span>

    <div style="display:flex; gap:10px">
      <button id="ma-accept" style="
        background:#2563eb;
        color:#fff;
        border:0;
        padding:8px 14px;
        border-radius:6px;
        cursor:pointer;
      ">
        Accept
      </button>

      <button id="ma-decline" style="
        background:#334155;
        color:#fff;
        border:0;
        padding:8px 14px;
        border-radius:6px;
        cursor:pointer;
      ">
        Decline
      </button>
    </div>
  </div>
</div>

<script>
(function () {
  const consent = localStorage.getItem('ma_consent');
  const banner = document.getElementById('ma-consent');

  if (!consent) {
    banner.style.display = 'block';
  }

  if (consent === 'granted') {
    startGA();
  }

  document.getElementById('ma-accept').onclick = function () {
    localStorage.setItem('ma_consent', 'granted');
    startGA();
    banner.remove();
  };

  document.getElementById('ma-decline').onclick = function () {
    localStorage.setItem('ma_consent', 'denied');
    banner.remove();
  };

  function startGA() {
    if (typeof gtag !== 'function') return;

    // Allow analytics
    gtag('consent', 'update', {
      analytics_storage: 'granted'
    });

    // Start GA session + send page_view
    gtag('js', new Date());
    gtag('config', 'G-KL111KNH3S', {
      anonymize_ip: true,
      send_page_view: true
    });
  }
})();
</script>
