<!-- === Crypto Ticker with Affiliate Links === -->
<style>
  :root{ --ticker-h: 52px; } /* povisi ako želiš veći */
  #ma-ticker{
    position: fixed;
    inset: auto 0 0 0;              /* bottom:0; left:0; right:0 */
    width: 100vw;                   /* prisili punu širinu prozora */
    max-width: 100%;
    z-index: 2147483647;            /* iznad svega (cookie bar, sl.) */
    background: #0f1115;
    color: #fff;
    border-top: 1px solid #222;
    padding: 10px 0;                /* veći vertikalni padding */
    font: 15px/1.4 system-ui,Segoe UI,Roboto,Arial;
    white-space: nowrap;
    overflow: hidden;
    transform: translateZ(0);       /* izbjegne “rezanje” na nekim browserima */
  }
  #ma-ticker *{ box-sizing: border-box; }
  #ma-ticker-track{ display:inline-block; will-change: transform; }
</style>

<div id="ma-ticker">
  <div id="ma-ticker-track"></div>
</div>

<script>
/* === CONFIG (linkove drži kako jesu) === */
const items = [
  { id: "bitcoin",  label: "BTC", href: "https://accounts.binance.com/en/register?ref=YOUR_BINANCE_CODE" },
  { id: "ethereum", label: "ETH", href: "https://www.bybit.com/invite?ref=YOUR_BYBIT_CODE" },
  { id: "solana",   label: "SOL", href: "https://partner.bitget.com/bg/YOUR_BITGET_CODE" },
  { id: "ripple",   label: "XRP", href: "https://www.okx.com/join/YOUR_OKX_CODE" },
  { id: "cardano",  label: "ADA", href: "https://www.mexc.com/invite/detail?inviteCode=YOUR_MEXC_CODE" },
  { id: "toncoin",  label: "TON", href: "https://www.kucoin.com/r/af/YOUR_KUCOIN_CODE" }
];
const vs = "usd", refreshMs = 60000, pxPerSec = 40;

const track = document.getElementById("ma-ticker-track");
const ticker = document.getElementById("ma-ticker");

function renderRow(prices) {
  track.innerHTML = "";
  const row = document.createElement("div");
  row.style.display = "inline-flex";
  row.style.gap = "20px";
  row.style.padding = "0 16px";
  items.forEach(({id,label,href}) => {
    const price = prices?.[id]?.[vs] ?? null;
    const el = document.createElement("a");
    el.href = href; el.target = "_blank";
    el.rel = "nofollow sponsored noopener";
    el.style.cssText = "text-decoration:none;color:#fff;opacity:.95;display:inline-flex;gap:8px;align-items:center";
    el.innerHTML = `<span style="font-weight:700">${label}</span>
                    <span style="opacity:.85">${price ? "$"+price.toLocaleString() : "—"}</span>`;
    row.appendChild(el);
  });
  track.appendChild(row.cloneNode(true));
  track.appendChild(row);
  startMarquee();
  adjustBodyPadding();
}

let animId;
function startMarquee() {
  cancelAnimationFrame(animId);
  const width = track.scrollWidth / 2;
  let x = 0;
  const step = () => {
    x -= (pxPerSec / 60);
    if (-x >= width) x = 0;
    track.style.transform = `translateX(${x}px)`;
    animId = requestAnimationFrame(step);
  };
  animId = requestAnimationFrame(step);
}

async function fetchPrices() {
  try {
    const ids = items.map(i => i.id).join(",");
    const url = `https://api.coingecko.com/api/v3/simple/price?ids=${ids}&vs_currencies=${vs}`;
    const res = await fetch(url, { cache: "no-store" });
    if (!res.ok) throw new Error("Price fetch failed");
    const data = await res.json();
    renderRow(data);
  } catch (e) { renderRow(null); console.warn(e); }
}
function adjustBodyPadding(){
  const h = ticker.offsetHeight || parseInt(getComputedStyle(document.documentElement).getPropertyValue('--ticker-h')) || 52;
  document.documentElement.style.scrollPaddingBottom = h + "px";
  document.body.style.paddingBottom = h + "px";
}
fetchPrices();
setInterval(fetchPrices, refreshMs);
addEventListener("resize", adjustBodyPadding);
</script>
<!-- === /Crypto Ticker === -->
