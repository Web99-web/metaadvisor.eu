<div style="margin: 32px 0 22px 0; text-align: center;">

  <p style="font-size: 17px; font-weight: 600; margin-bottom: 14px;">
    If you found this article useful, press LIKE 👍
  </p>

  <a id="meta-like-btn"
     href="https://www.facebook.com/metaadvisor.eu/"
     target="_blank"
     rel="noopener nofollow"
     style="
       background-color:#1877F2;
       color:#fff;
       padding:14px 32px;
       font-size:17px;
       font-weight:600;
       border-radius:8px;
       text-decoration:none;
       display:inline-block;
       box-shadow:0 0 0 0 rgba(24,119,242,0.8);
     ">
    👍 Like MetaAdvisor
  </a>

</div>

<style>
  /* JASNO, VIDILJIVO, ali i dalje elegante pulsiranje */
  #meta-like-btn {
    animation: pulseMeta 1.9s infinite;
  }

  @keyframes pulseMeta {
    0%   { box-shadow:0 0 0 0 rgba(24,119,242,0.8); }
    50%  { box-shadow:0 0 18px 10px rgba(24,119,242,0); }
    100% { box-shadow:0 0 0 0 rgba(24,119,242,0); }
  }

  #meta-like-btn:hover {
    background-color:#0f5dd8;
  }
</style>

<script>
  document.addEventListener("DOMContentLoaded", function() {
    const b = document.getElementById("meta-like-btn");
    if(!b) return;

    b.addEventListener("click", function() {

      // 1) Lokalni brojač (za tvoj pregled)
      const k = localStorage.getItem("meta_like_clicks") || 0;
      localStorage.setItem("meta_like_clicks", Number(k)+1);

      // 2) Šaljemo Cloudflare event
      fetch("/__meta_like_event__", { method: "POST" })
        .catch(() => {});
    });
  });
</script>
