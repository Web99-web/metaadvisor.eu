<!-- Facebook Like Button (Clean Mini Version) -->
<div style="margin: 28px 0 18px 0; text-align: center;">

  <p style="font-size: 17px; font-weight: 600; margin-bottom: 10px;">
    If you liked this article, press LIKE ❤️
  </p>

  <div class="fb-like"
       data-href="https://www.facebook.com/metaadvisor.eu/"
       data-width=""
       data-layout="standard"
       data-action="like"
       data-size="large"
       data-share="false">
  </div>

</div>

<div id="fb-root"></div>
<script async defer crossorigin="anonymous"
        src="https://connect.facebook.net/en_US/sdk.js#xfbml=1&version=v18.0"></script>
