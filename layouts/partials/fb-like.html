<div style="margin: 28px 0 18px 0; text-align: center;">

  <p style="font-size: 17px; font-weight: 600; margin-bottom: 12px;">
    If you found this article useful, press FOLLOW 👍
  </p>

  <a id="meta-follow-btn"
     href="https://www.facebook.com/metaadvisor.eu/"
     target="_blank"
     rel="noopener nofollow"
     style="
       background-color:#1877F2;
       color:#fff;
       padding:12px 28px;
       font-size:16px;
       font-weight:600;
       border-radius:8px;
       text-decoration:none;
       display:inline-block;
       box-shadow:0 0 0 0 rgba(24,119,242,0.6);
       transition:box-shadow 0.3s ease;
     ">
    👍 Follow MetaAdvisor
  </a>

</div>

<style>
  /* Pulsiranje (subtilno i profesionalno) */
  #meta-follow-btn {
    animation: pulseMetaBtn 2.2s infinite;
  }

  @keyframes pulseMetaBtn {
    0%   { box-shadow:0 0 0 0 rgba(24,119,242,0.6); }
    70%  { box-shadow:0 0 12px 8px rgba(24,119,242,0); }
    100% { box-shadow:0 0 0 0 rgba(24,119,242,0); }
  }
</style>

<script>
  // Klik statistika (lagana, lokalna)
  document.addEventListener("DOMContentLoaded", function() {
    const btn = document.getElementById("meta-follow-btn");
    if(btn){
      btn.addEventListener("click", function(){
        // Pohrani broj klikova u localStorage (vidljivo samo tebi)
        const k = localStorage.getItem("meta_follow_clicks") || 0;
        localStorage.setItem("meta_follow_clicks", Number(k) + 1);

        // Event u konzoli (možeš pratiti preko DevTools)
        console.log("Follow button clicked:", Number(k)+1);
      });
    }
  });
</script>
