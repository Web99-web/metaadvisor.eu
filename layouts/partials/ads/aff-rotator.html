<!-- Affiliate Rotator Banner (per-visit rotation) -->
<div class="aff-wrap" style="margin:22px 0;">
  <div style="font:600 12px/1 system-ui,Segoe UI,Roboto,Arial;color:#94a3b8;letter-spacing:.06em;margin:0 6px 8px;">
    SPONSORED
  </div>

  <a id="aff-link" href="#" target="_blank" rel="nofollow sponsored noopener"
     style="display:block;text-decoration:none;">
    <!-- Varijanta bez slike (gradijent “brand” banner) -->
    <div id="aff-banner"
         style="width:100%;min-height:96px;border-radius:14px;border:1px solid #e5e7eb;
                background:linear-gradient(135deg,#0ea5e9 0%,#2563eb 100%);
                color:#fff;box-shadow:0 8px 24px rgba(2,8,23,.12);
                display:flex;align-items:center;justify-content:space-between;
                gap:16px;padding:18px 22px">
      <div style="display:flex;flex-direction:column;gap:6px">
        <span id="aff-title" style="font-weight:800;font-size:18px;letter-spacing:.2px">Loading…</span>
        <span id="aff-sub"   style="opacity:.95">Exclusive offer</span>
      </div>
      <span id="aff-cta"
            style="font-weight:800;background:rgba(255,255,255,.14);
                   border:1px solid rgba(255,255,255,.25);padding:10px 14px;border-radius:999px">
        Start now →
      </span>
    </div>

    <!-- Ako želiš slikovni banner, samo odkomentiraj i stavi img URL u configu ispod
    <img id="aff-img" src="" alt="" style="display:none;width:100%;height:auto;border-radius:14px;border:1px solid #e5e7eb">
    -->
  </a>
</div>

<script>
/* 1) POPIS AFFILIATE PARTNERA (dodaj/uredi po želji)
   - name   : prikazni naziv
   - url    : referral link (+ automatski ćemo dodati UTM)
   - cta    : tekst gumba (desno)
   - sub    : podnaslov (manjim slovima)
   - img    : (opcionalno) URL slike 970×250; ako je postavljen, koristit će se slika
*/
const AFF_PARTNERS = [
  { name: "MEXC",     url: "https://www.mexc.com/invite/register?inviteCode=1dVNP&source=invite&utm_source=usershare&utm_medium=usershare&utm_biz=affiliate&utm_campaign=invite", cta:"Trade on MEXC",  sub:"Low fees • Wide Alt coverage", img:"" },
  { name: "Bitget",   url: "https://www.bitgetapps.com/referral/register?clacCode=2QZSXTW1&from=%2Fevents%2Freferral-all-program&source=events&utmSource=PremierInviter", cta:"Join Bitget", sub:"Copy trading • SOL ecosystem", img:"" },
  { name: "Bybit",    url: "https://www.bybit.com/en/invite/?ref=WPRPKQ9", cta:"Start on Bybit", sub:"Pro features • Deep liquidity", img:"" },
  { name: "BloFin",   url: "https://blofin.com/register?referral_code=95SDq1", cta:"Try BloFin", sub:"Earn & trade • DeFi focus", img:"" },
  { name: "KuCoin",   url: "https://www.kucoin.com/ucenter/signup?lang=en_US&rcode=QBSTQETT&utm_source=rf", cta:"Sign up KuCoin", sub:"KCS perks • Fast listings", img:"" },
  { name: "THORWallet (RUNE)", url: "https://app.thorwallet.org/referrals?code=877805", cta:"Get THORWallet", sub:"THORChain native access", img:"" },
  { name: "ABCD Stable", url: "https://www.abcdstable.com/referral/register?clacCode=2QZSXTW1&from=%2Fevents%2Freferral-all-program&source=events&utmSource=PremierInviter", cta:"Earn with ABCD", sub:"Yield on stable assets", img:"" }
];

/* 2) ROTACIJA: “po posjeti” – svaki put kad korisnik otvori stranicu,
      prikažemo sljedećeg partnera iz liste (kružna rotacija).
      Koristimo localStorage brojač posjeta. */
(function rotateAffiliate(){
  try{
    const key = "ma_visit_count";
    let n = parseInt(localStorage.getItem(key)||"0",10);
    const idx = n % AFF_PARTNERS.length;
    localStorage.setItem(key, (n+1).toString());

    const p = AFF_PARTNERS[idx];

    // Dodaj UTM parametre (da znaš da je to s rotatora)
    const url = new URL(p.url);
    if(!url.searchParams.get("utm_source")) url.searchParams.set("utm_source","metaadvisor");
    url.searchParams.set("utm_medium","rotator");
    url.searchParams.set("utm_campaign", (p.name||"aff").toLowerCase());

    const link = document.getElementById("aff-link");
    const banner = document.getElementById("aff-banner");
    const title = document.getElementById("aff-title");
    const sub   = document.getElementById("aff-sub");
    const cta   = document.getElementById("aff-cta");
    const img   = document.getElementById("aff-img");

    link.href = url.toString();
    title.textContent = p.name;
    sub.textContent   = p.sub || "Exclusive offer";
    cta.textContent   = p.cta || "Start now →";

    if (img && p.img){
      img.src = p.img;
      img.alt = p.name;
      img.style.display = "block";
      banner.style.display = "none";
    }
  }catch(e){ console.warn("Affiliate rotator:", e); }
})();
</script>
