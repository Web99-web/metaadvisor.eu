{{- $links := partial "seo-links.html" . -}}
{{ if $links.Noindex }}
<meta name="robots" content="noindex, follow">
{{ else }}
{{ range $links.Alternates }}
<link rel="alternate" hreflang="{{ .Lang }}" href="{{ .URL }}">
{{ if eq .Lang "en" }}<link rel="alternate" hreflang="x-default" href="{{ .URL }}">{{ end }}
{{ end }}
{{ end }}
<link rel="canonical" href="{{ $links.Canonical }}">
