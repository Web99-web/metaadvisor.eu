<div id="onsite-search" style="max-width:1200px;margin:12px auto 4px;padding:0 16px;">
  <form id="onsite-search-form" style="display:flex;gap:10px;align-items:center;max-width:880px;">
    <input id="q" type="search" placeholder="Pretraga po naslovu/sažetku…" aria-label="Pretraga"
           style="flex:1;padding:10px 14px;border:1px solid #cfd6e4;border-radius:10px;font-size:16px;">
    <button type="submit"
            style="padding:10px 14px;border:1px solid #cfd6e4;border-radius:10px;cursor:pointer;font-size:16px;">
      Search
    </button>
  </form>

  <div id="search-results" class="cards" style="margin-top:14px;display:grid;grid-template-columns:1fr;gap:24px;"></div>
</div>

<style>
  @media(min-width:640px){ #onsite-search .cards{ grid-template-columns: 1fr 1fr; } }
  @media(min-width:1024px){ #onsite-search .cards{ grid-template-columns: 1fr 1fr 1fr; } }
  #onsite-search .card{ display:flex; flex-direction:column; border:1px solid #e6e8ee; border-radius:12px; overflow:hidden; background:#fff; }
  #onsite-search .card-img{ width:100%; height:220px; object-fit:cover; display:block; }
  #onsite-search .card-body{ padding:12px 14px; display:flex; flex-direction:column; gap:8px; }
  #onsite-search .card-meta{ font-size:.9rem; opacity:.8; }
  #onsite-search .card-title{ font-size:1rem; line-height:1.35; margin:0; }
  #onsite-search .card-title a{ text-decoration:none; }
  #onsite-search .card-title a:hover{ text-decoration:underline; }
  #onsite-search .card-summary{ font-size:.95rem; opacity:.9; }
</style>

<script>
(function(){
  var form = document.getElementById('onsite-search-form');
  var input = document.getElementById('q');
  var grid  = document.getElementById('search-results');
  var DATA = null;

  function cardHTML(it){
    var date = it.date ? it.date : '';
    var img  = it.image || '/images/placeholder-metaadvisor-small.jpg';
    var title = it.title || '';
    var sum = it.summary ? it.summary : '';
    return (
      '<div class="card">'
      +  '<a href="'+it.url+'" target="_blank" rel="noopener">'
      +    '<img class="card-img" src="'+img+'" alt="'+title.replace(/"/g,'&quot;')+'">'
      +  '</a>'
      +  '<div class="card-body">'
      +    '<div class="card-meta">'+ (date ? date : '') +'</div>'
      +    '<h3 class="card-title"><a href="'+it.url+'" target="_blank" rel="noopener">'+title+'</a></h3>'
      +    (sum ? '<p class="card-summary">'+sum+'</p>' : '')
      +  '</div>'
      +'</div>'
    );
  }

  function render(items){
    if(!items || !items.length){
      grid.innerHTML = '<div style="opacity:.7;padding:6px 2px;">No results.</div>';
      return;
    }
    grid.innerHTML = items.map(cardHTML).join('');
  }

  function search(q){
    if(!DATA){ return; }
    q = (q||'').toLowerCase().trim();
    if(!q){ grid.innerHTML=''; return; }
    var words = q.split(/\s+/);
    var res = DATA.filter(function(it){
      var hay = (it.title+' '+(it.summary||'')+' '+(it.tags||[]).join(' ')).toLowerCase();
      return words.every(function(w){ return hay.indexOf(w) >= 0; });
    }).slice(0,30);
    render(res);
  }

  fetch('/index.json', {credentials:'omit'})
    .then(function(r){ return r.json(); })
    .then(function(j){ DATA = j; })
    .catch(function(){ grid.innerHTML = '<div style="color:#b42318">Greška pri učitavanju indeksa.</div>'; });

  form.addEventListener('submit', function(e){ e.preventDefault(); search(input.value); });
  input.addEventListener('input', function(){ search(input.value); });
})();
</script>
