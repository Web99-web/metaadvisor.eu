{{ if gt .Paginator.TotalPages 1 }}
<nav class="pagination" role="navigation">
  {{ if .Paginator.HasPrev }}
    <a class="page-btn" href="{{ .Paginator.First.URL }}" aria-label="First">««</a>
    <a class="page-btn" href="{{ .Paginator.Prev.URL }}" aria-label="Previous">«</a>
  {{ end }}

  {{ range .Paginator.Pagers }}
    {{ if eq . .Paginator }}
      <span class="page-btn active">{{ .PageNumber }}</span>
    {{ else }}
      <a class="page-btn" href="{{ .URL }}">{{ .PageNumber }}</a>
    {{ end }}
  {{ end }}

  {{ if .Paginator.HasNext }}
    <a class="page-btn" href="{{ .Paginator.Next.URL }}" aria-label="Next">»</a>
    <a class="page-btn" href="{{ .Paginator.Last.URL }}" aria-label="Last">»»</a>
  {{ end }}
</nav>
{{ end }}
