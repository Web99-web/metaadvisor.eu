# Variant D: unknown/non-approved tag terms emit neither HTML nor RSS.
# Selected A term control files override this cascade; article front matter is untouched.
timeout = "5m"
baseURL = "https://metaadvisor.eu/"
title = "MetaAdvisor.eu"
paginate = 96
paginatePath = "page"
enableRobotsTXT = true
ignoreFiles = ["^content/_inbox/"]  # (1) ne renderiraj _inbox

defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false

[permalinks]
  news = "/news/:slug/"

[languages]
  [languages.en]
    languageName = "English"
    weight = 1
    languageCode = "en"

  [languages.de]
    languageName = "Deutsch"
    weight = 2
    languageCode = "de"

  [languages.hr]
    languageName = "Hrvatski"
    weight = 3
    languageCode = "hr"

[params]
tagline           = "Automated summaries of news from publicly available sources."
showAds           = true
placeholder_image = "/images/finance.jpg"

  [params.ads]
  provider = "a-ads"        # "a-ads" | "house"
  client   = "2411598"      # tvoj A-ADS Ad Unit ID
  slot     = ""             # ne koristi se za A-ADS
  size     = "Adaptive"     # bolje za ispod hero, radi i na mobitelu i na desktopu

 # ⬇️ DODAJ OVO (možeš ostaviti prazno za one koje nemaš)
  [params.social]
  instagram = "https://www.instagram.com/metaadvisor.eu/"
  facebook  = "https://www.facebook.com/profile.php?id=61580191122240"
  x         = "https://x.com/MetaadvisorEU"
  tiktok    = "https://www.tiktok.com/@metaadvisor.eu"
  linkedin  = "https://www.linkedin.com/company/metaadvisoreu/"
  mastodon  = "https://mastodon.social/@metaadvisor"
  buymeacoffee = "https://buymeacoffee.com/metaadvisor"
  

[taxonomies]
  tag = "tags"
  category = "categories"

# Reviewed topic policy only; article tags remain unchanged.
[[module.mounts]]
  source = "generated/topic-content/en"
  target = "content"
  lang = "en"
[[module.mounts]]
  source = "generated/topic-content/de"
  target = "content"
  lang = "de"
[[module.mounts]]
  source = "generated/topic-content/hr"
  target = "content"
  lang = "hr"

[[module.mounts]]
  source = "data/tag_policy.json"
  target = "data/tag_policy.json"

# Hugo 0.128: the English source must not also read translated source trees.
[[module.mounts]]
  source = "content"
  target = "content"
  lang = "en"
  excludeFiles = ["de/**", "hr/**", "_inbox/**", "en/index.md", "news/how-to-read-crypto-charts-2025-beginners.md", "news/2025/09/11/how-thousands-of-overworked-underpaid-humans-train-googles-ai-to-seem-smart-fbcc38.md", "news/2025/09/11/how-thousands-of-overworked-underpaid-humans-train-googles-ai-to-seem-smart.md", "news/2026/06/26/hackers-attack-plitvice-lakes-national-park-croatia\".md"]
[[module.mounts]]
  source = "content/de"
  target = "content"
  lang = "de"
  excludeFiles = ["news/2025/10/25/ChatGPT je rekao:  mittelgrosse-bitcoin-miner-holen-auf-nach-halving-guenstiger-strom-weniger-schulden-neue-erloese.md", "news/2025/12/04/harvey-ai-startup-rechtsbranche-revolution\".md"]
[[module.mounts]]
  source = "content/hr"
  target = "content"
  lang = "hr"
  excludeFiles = ["news/2025/09/11/kako-tisuce-preplavljenih-nedovoljno-placenih-treniraju-googleov-ai-da-izgleda-pametno-c874c3.md", "news/2025/09/11/kako-tisuce-preplavljenih-nedovoljno-placenih-treniraju-googleov-ai-da-izgleda-pametno.md", "news/2025/12/07/lazni-rudnik-zlata-100-km-ai-dezinformacije\".md"]

[outputs]
  home    = ["HTML", "RSS", "JSON"]
  section = ["HTML", "RSS"]     # (2) omogući RSS na /news/ itd.

  [markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[[cascade]]
  [cascade._build]
    render = "never"
    list = "never"
  [cascade._target]
    kind = "term"
    path = "/tags/**"


# Actual image MIME catalog; no page URL or indexing changes.
[[module.mounts]]
  source = "data/image_mime.json"
  target = "data/image_mime.json"

[[module.mounts]]
  source = "data/article_routes.json"
  target = "data/article_routes.json"

[[module.mounts]]
  source = "data/article_alias_memberships.json"
  target = "data/article_alias_memberships.json"

[[module.mounts]]
  source = "data/bundle_mime_aliases.json"
  target = "data/bundle_mime_aliases.json"

[[module.mounts]]
  source = "data/consent_policy.json"
  target = "data/consent_policy.json"
